<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apscios OS Hub</title>
    <style>
        :root {
            --primary: #007bff;
            --hover: #0056b3;
            --bg: #f8f9fa;
            --text: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 { margin-bottom: 0.5rem; }
        p { margin-bottom: 2rem; color: #666; }
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--hover);
        }
        .btn-secondary {
            background-color: #e2e6ea;
            color: #333;
        }
        .btn-secondary:hover {
            background-color: #dbe0e5;
        }
        .status {
            margin-top: 2rem;
            font-size: 0.9rem;
            padding: 0.5rem;
            border-radius: 4px;
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Apscios OS</h1>
        <p>The Future of Fedora-based Computing. Ready for production.</p>

        <div class="button-group">
            <a href="Apscios-Workstation-Live.iso" class="btn btn-primary">Download ISO</a>
            <a href="docs/index.html" class="btn btn-secondary">Read Documentation</a>
        </div>

        <div class="status">
            Server Status: <strong>Online</strong> | Region: Localhost
        </div>
    </div>
</body>
</html>
